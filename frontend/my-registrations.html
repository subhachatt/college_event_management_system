<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Registrations - CampusHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">🎓</div>
        <span class="brand-title">CampusHub</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <!-- Injected dynamically by api.js -->
      </ul>

      <div class="nav-actions" id="nav-actions">
        <!-- Injected dynamically by api.js -->
      </div>

      <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle Navigation">☰</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="container">
      <div class="section-header">
        <div>
          <h1>My Event Passes & Registrations</h1>
          <p>Track your registered college events, attendance passes, and status.</p>
        </div>
        <a href="events.html" class="btn btn-primary btn-sm">+ Register for More Events</a>
      </div>

      <!-- Registration Tabs -->
      <div class="tabs-nav">
        <button class="tab-btn active" onclick="setRegistrationTab('upcoming', this)">
          📅 Upcoming Events <span id="tab-count-upcoming">(0)</span>
        </button>
        <button class="tab-btn" onclick="setRegistrationTab('completed', this)">
          ✓ Completed <span id="tab-count-completed">(0)</span>
        </button>
        <button class="tab-btn" onclick="setRegistrationTab('cancelled', this)">
          ✕ Cancelled <span id="tab-count-cancelled">(0)</span>
        </button>
        <button class="tab-btn" onclick="setRegistrationTab('all', this)">
          All Registrations
        </button>
      </div>

      <!-- Registrations Ticket List -->
      <div id="registrations-list" class="ticket-list">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 CampusHub • College Event Management System</div>
        <div>FastAPI • SQLite • Vanilla JS • Modern CSS</div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/registrations.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (requireAuth("STUDENT")) {
        loadMyRegistrations();
      }
    });
  </script>
</body>
</html>
