<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - CampusHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">🎓</div>
        <span class="brand-title">CampusHub</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <!-- Injected dynamically by api.js -->
      </ul>

      <div class="nav-actions" id="nav-actions">
        <!-- Injected dynamically by api.js -->
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <h1>Student Registration</h1>
        <p>Create your student profile to discover and register for campus events</p>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="name">Full Name *</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-control" 
            placeholder="e.g. Siddharth Verma" 
            required 
            minlength="2"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">College Email Address *</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="e.g. sid@student.edu" 
            required
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="student_id">Student ID / Roll No.</label>
            <input 
              type="text" 
              id="student_id" 
              name="student_id" 
              class="form-control" 
              placeholder="e.g. CS-2025-089"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="department">Department *</label>
            <select id="department" name="department" class="form-select" required>
              <option value="">Select Department</option>
              <option value="Computer Science">Computer Science & Eng.</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics & Comm.">Electronics & Comm.</option>
              <option value="Mechanical Eng.">Mechanical Eng.</option>
              <option value="Civil Eng.">Civil Eng.</option>
              <option value="Electrical Eng.">Electrical Eng.</option>
              <option value="Management Studies">Management Studies (MBA/BBA)</option>
              <option value="Sciences & Humanities">Sciences & Humanities</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password *</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Minimum 6 characters" 
            required 
            minlength="6"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 0.75rem;">
          Create Student Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html"><strong>Sign In here</strong></a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      redirectIfAuthenticated();
    });
  </script>
</body>
</html>
