<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Participants - CampusHub Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">🎓</div>
        <span class="brand-title">CampusHub</span>
        <span class="badge badge-purple" style="margin-left: 0.5rem;">Admin</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <!-- Injected dynamically by api.js -->
      </ul>

      <div class="nav-actions" id="nav-actions">
        <!-- Injected dynamically by api.js -->
      </div>

      <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle Navigation">☰</button>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-title">Admin Management</div>
      <a href="admin-dashboard.html" class="admin-nav-item">
        <span class="admin-nav-icon">📊</span>
        <span>Overview & Stats</span>
      </a>
      <a href="create-event.html" class="admin-nav-item">
        <span class="admin-nav-icon">➕</span>
        <span>Create New Event</span>
      </a>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1 id="event-title-header">Event Participants</h1>
          <p id="event-meta-summary">Loading event participant roster...</p>
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <button class="btn btn-secondary btn-sm" onclick="exportParticipantsCSV()">
            📥 Export CSV
          </button>
          <a href="admin-dashboard.html" class="btn btn-secondary btn-sm">
            ← Back to Events
          </a>
        </div>
      </div>

      <!-- Filter Controls -->
      <div class="card" style="margin-bottom: 1.5rem; padding: 1rem;">
        <div class="form-row" style="align-items: center;">
          <div class="form-group" style="margin: 0; flex: 2;">
            <input 
              type="text" 
              id="search-participant" 
              class="form-control" 
              placeholder="Search student name, ID, or email..."
              oninput="filterParticipantsList()"
            >
          </div>

          <div class="form-group" style="margin: 0; flex: 1;">
            <select id="filter-dept" class="form-select" onchange="filterParticipantsList()">
              <option value="All">All Departments</option>
            </select>
          </div>

          <div style="font-size: 0.85rem; color: var(--text-muted); text-align: right;">
            Showing <strong id="filtered-count" style="color: var(--text-main);">0</strong> attendees
          </div>
        </div>
      </div>

      <!-- Participants Table -->
      <div class="card">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Student Name</th>
                <th>Student ID</th>
                <th>Email</th>
                <th>Department</th>
                <th>Registered Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="participants-tbody">
              <tr>
                <td colspan="7" style="text-align: center; padding: 2rem;">Loading participants...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (requireAuth("ADMIN")) {
        loadParticipantsPage();
      }
    });
  </script>
</body>
</html>
