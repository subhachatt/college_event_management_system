<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - CampusHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">🎓</div>
        <span class="brand-title">CampusHub</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <!-- Injected dynamically by api.js -->
      </ul>

      <div class="nav-actions" id="nav-actions">
        <!-- Injected dynamically by api.js -->
      </div>

      <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle Navigation">☰</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="container">
      <div class="profile-card">
        <div class="profile-card-header">
          <div class="profile-avatar-circle" id="profile-avatar-initial">
            U
          </div>
        </div>

        <div class="profile-card-body">
          <h2 class="profile-name" id="profile-name">Loading User...</h2>
          <div style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.25rem;">
            <span id="profile-role-badge" class="badge badge-primary">STUDENT</span>
          </div>

          <div class="profile-info-grid">
            <div class="profile-info-item">
              <h4>College Email</h4>
              <p id="profile-email">--</p>
            </div>

            <div class="profile-info-item">
              <h4>Student ID / Roll No.</h4>
              <p id="profile-student-id">--</p>
            </div>

            <div class="profile-info-item">
              <h4>Academic Department</h4>
              <p id="profile-department">--</p>
            </div>

            <div class="profile-info-item">
              <h4>Member Since</h4>
              <p id="profile-joined-date">--</p>
            </div>

            <div class="profile-info-item" style="grid-column: 1 / -1;">
              <h4>Active Event Passes</h4>
              <p id="profile-total-registrations">--</p>
            </div>
          </div>

          <div style="display: flex; gap: 1rem; justify-content: center;">
            <button class="btn btn-primary" onclick="openEditProfileModal()">
              ✏️ Edit Profile
            </button>
            <button class="btn btn-secondary" onclick="handleLogout()">
              Sign Out
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div id="edit-profile-modal" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Edit Profile Details</h3>
        <button class="modal-close" onclick="closeEditProfileModal()">✕</button>
      </div>
      <form id="edit-profile-form" onsubmit="handleUpdateProfile(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="edit-name">Full Name *</label>
            <input type="text" id="edit-name" class="form-control" required minlength="2">
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-student-id">Student ID</label>
            <input type="text" id="edit-student-id" class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-department">Department</label>
            <input type="text" id="edit-department" class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-password">New Password (Leave blank to keep current)</label>
            <input type="password" id="edit-password" class="form-control" placeholder="••••••••" minlength="6">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeEditProfileModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 CampusHub • College Event Management System</div>
        <div>FastAPI • SQLite • Vanilla JS • Modern CSS</div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (requireAuth()) {
        loadUserProfilePage();
      }
    });
  </script>
</body>
</html>
